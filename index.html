<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>検査・生産計算</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:520px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}h1{font-size:22px;margin:4px 0 14px}h2{font-size:19px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:19px;background:#fff;color:#111827}input::placeholder{color:#94a3b8}button,input{min-height:46px}button{cursor:pointer}.mini{font-size:12px;color:#64748b;text-align:right;margin:4px 3px 8px}.add{width:100%;padding:10px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800;margin-top:5px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{padding:12px;border:2px solid #2563eb;border-radius:10px;background:#fff;color:#2563eb;font-weight:800}.tab.on{outline:2px solid #93c5fd;outline-offset:1px}.disp{border:1px solid #dbe2ea;border-radius:12px;padding:12px;background:#fff}.expr{font-size:21px;font-weight:800;word-break:break-all;min-height:28px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.key{border:0;border-radius:10px;min-height:55px;font-size:22px;font-weight:800;background:#e2e8f0;color:#0f172a}.plus{background:#f59e0b;color:#fff}.del{background:#64748b;color:#fff}.clr{background:#dc2626;color:#fff}.judgement{padding:8px 3px;font-weight:800}.result{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;margin:7px 0;border-radius:11px;background:#dcfce7;color:#14532d}.value{text-align:right;font-size:19px;font-weight:800}.pct{display:block;font-size:13px;color:#3f6212}.green{background:#dcfce7;color:#166534;padding:11px;border-radius:10px;margin-top:8px;font-weight:800}.info{padding:9px 3px;font-weight:800}.warn{display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:9px;margin-top:9px;font-size:13px;font-weight:700}.clearSession,.resetAll{width:100%;padding:15px;border:0;border-radius:12px;color:#fff;font-size:17px;font-weight:800;margin-top:10px}.clearSession{background:#2563eb}.resetAll{background:#dc2626}.resetAll.ask{background:#991b1b}:focus{outline:3px solid #2563eb55;outline-offset:1px}@media(prefers-color-scheme:dark){body{background:#0b1220;color:#e5e7eb}.card{background:#111827;border-color:#374151}input,.disp{background:#1f2937;color:#fff;border-color:#4b5563}.key{background:#374151;color:#fff}.plus{background:#d97706}.mini{color:#9ca3af}}
</style></head><body><main><h1>検査・生産計算</h1>
<section class="card"><h2>入力</h2><label for="ti">総本数</label><input id="ti" type="number" inputmode="numeric" min="0" step="1" placeholder="総本数を入力"><button type="button" class="add" id="at">総本数を加算</button><div class="mini" id="ts">合計 0本</div><label for="wi">総重量</label><input id="wi" type="number" inputmode="decimal" min="0" step="any" placeholder="総重量を入力"><button type="button" class="add" id="aw">総重量を加算</button><div class="mini" id="ws">合計 0</div>
<div class="tabs"><button type="button" class="tab on" data-tab="B">判定B</button><button type="button" class="tab" data-tab="C">判定C</button></div><div class="disp"><b id="target">判定B 入力中</b><div id="expr" class="expr">0</div><div id="es" class="mini">合計 0本</div></div><div class="keys">
<button type="button" class="key" data-k="7">7</button><button type="button" class="key" data-k="8">8</button><button type="button" class="key" data-k="9">9</button><button type="button" class="key plus" data-k="+">＋</button><button type="button" class="key" data-k="4">4</button><button type="button" class="key" data-k="5">5</button><button type="button" class="key" data-k="6">6</button><button type="button" class="key del" data-k="back">⌫</button><button type="button" class="key" data-k="1">1</button><button type="button" class="key" data-k="2">2</button><button type="button" class="key" data-k="3">3</button><button type="button" class="key clr" data-k="clear">C</button><button type="button" class="key" data-k="0" style="grid-column:span 3">0</button><button type="button" class="key plus" data-k="+">＋</button></div>
<div class="judgement">判定B：<span id="b">0</span>本　判定C：<span id="c">0</span>本</div><div class="judgement">判定A（自動）：<span id="a">0</span>本</div><label for="bad">不良品</label><input id="bad" type="number" inputmode="numeric" min="0" step="1" placeholder="不良品本数を入力"><div id="warn" class="warn" aria-live="polite"></div></section>
<section class="card" aria-live="polite"><h2>計算結果</h2><div class="result"><b>良品本数</b><span class="value"><span id="good">0本</span><span id="gp" class="pct">0.00%</span></span></div><div class="result"><b>手入れ品本数</b><span class="value"><span id="repair">0本</span><span id="rp" class="pct">0.00%</span></span></div><div class="result"><b>不良品本数</b><span class="value"><span id="badn">0本</span><span id="bp" class="pct">0.00%</span></span></div></section>
<section class="card"><h2>スクラップ・生産重量</h2><label for="unit">単重</label><input id="unit" type="number" inputmode="decimal" min="0" step="any" placeholder="単重を入力"><div class="info">スクラップ本数（不良品）：<span id="sn">0</span>本</div><div class="green">スクラップ重量：<span id="sw">0</span></div><div class="green">生産重量：<span id="pw">0</span></div><button type="button" id="clear" class="clearSession">合計を残してクリア</button><div id="note" class="warn" aria-live="polite"></div><button type="button" id="reset" class="resetAll">全てをクリア</button></section>
</main><script>
(()=>{const q=s=>document.querySelector(s);let total=0,weight=0,active='B',confirmAll=false;const e={B:'',C:''};const sx=s=>s?s.split('+').filter(Boolean).reduce((a,v)=>a+(Number(v)||0),0):0;const nv=id=>{const el=q(id);if(!el||el.value==='')return 0;const v=Number(el.value);return Number.isFinite(v)&&v>=0?v:0};const fmt=n=>Number.isInteger(n)?String(n):String(Number(n.toFixed(3)));
function calc(){const b=sx(e.B),c=sx(e.C),bad=nv('#bad'),u=nv('#unit');const a=Math.max(0,total-b-c),good=a,repair=Math.max(0,total-good-bad),sw=Math.round(u*bad),pw=Math.round(weight-sw);q('#ts').textContent='合計 '+fmt(total)+'本';q('#ws').textContent='合計 '+fmt(weight);q('#b').textContent=fmt(b);q('#c').textContent=fmt(c);q('#a').textContent=fmt(a);const p=n=>total>0?(n/total*100).toFixed(2)+'%':'0.00%';q('#good').textContent=fmt(good)+'本';q('#gp').textContent=p(good);q('#repair').textContent=fmt(repair)+'本';q('#rp').textContent=p(repair);q('#badn').textContent=fmt(bad)+'本';q('#bp').textContent=p(bad);q('#sn').textContent=fmt(bad);q('#sw').textContent=String(sw);q('#pw').textContent=String(Math.max(0,pw));const m=[];if(total>0&&b+c>total)m.push('判定B＋判定Cが総本数を超えています。');if(total>0&&bad>total)m.push('不良品本数が総本数を超えています。');if(weight>0&&sw>weight)m.push('スクラップ重量が総重量を超えています。');if(q('#bad').value!==''&&!Number.isInteger(Number(q('#bad').value)))m.push('不良品本数は整数で入力してください。');q('#warn').style.display=m.length?'block':'none';q('#warn').textContent=m.join(' ')}
function show(){q('#target').textContent='判定'+active+' 入力中';q('#expr').textContent=e[active]||'0';q('#es').textContent='合計 '+fmt(sx(e[active]))+'本';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===active));calc()}
function add(id,type){const el=q(id);if(el.value==='')return;const v=Number(el.value);if(!Number.isFinite(v)||v<0)return;if(type==='t'&&!Number.isInteger(v)){alert('総本数は整数で入力してください。');return}if(type==='t')total+=v;else weight+=v;el.value='';calc()}
q('#at').addEventListener('click',()=>add('#ti','t'));q('#aw').addEventListener('click',()=>add('#wi','w'));q('#ti').addEventListener('keydown',x=>{if(x.key==='Enter'){x.preventDefault();add('#ti','t')}});q('#wi').addEventListener('keydown',x=>{if(x.key==='Enter'){x.preventDefault();add('#wi','w')}});document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>{active=x.dataset.tab;show()}));document.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('click',()=>{const k=x.dataset.k;if(k==='clear')e[active]='';else if(k==='back')e[active]=e[active].slice(0,-1);else if(k==='+'){if(e[active]&&!e[active].endsWith('+'))e[active]+='+'}else e[active]+=k;show()}));['#bad','#unit'].forEach(id=>q(id).addEventListener('input',calc));
function clearWork(){e.B='';e.C='';active='B';['#bad','#unit','#ti','#wi'].forEach(id=>q(id).value='');confirmAll=false;q('#note').style.display='none';q('#note').textContent='';q('#reset').textContent='全てをクリア';q('#reset').classList.remove('ask');show()};q('#clear').addEventListener('click',clearWork);q('#reset').addEventListener('click',()=>{if(!confirmAll){confirmAll=true;q('#note').style.display='block';q('#note').textContent='総本数・総重量の合計も含め、全てクリアしますか？ もう一度タップすると消去します。';q('#reset').textContent='もう一度タップして全てをクリア';q('#reset').classList.add('ask');return}total=0;weight=0;clearWork()});show()})();
</script></body></html>
