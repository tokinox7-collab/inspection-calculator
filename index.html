<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="検査実績計算">
<title>検査実績計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}.app{max-width:430px;margin:auto;padding:6px;background:#f8fafc;min-height:100vh}.title{font-size:18px;font-weight:900}.guide{font-size:14px;font-weight:900;color:#2563eb;margin:2px 0}.msg{min-height:15px;color:#dc2626;font-size:11px;font-weight:700}.disp{width:100%;height:44px;text-align:right;font-size:26px;font-weight:900;padding:4px 9px;margin-bottom:5px;border:2px solid #cbd5e1;border-radius:9px;background:#fff}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.key{height:60px;border:1px solid #94a3b8;border-radius:11px;background:#fff;font-size:27px;font-weight:900;touch-action:manipulation}.key:active{background:#e2e8f0;transform:scale(.97)}.key:focus,.reset:focus{outline:3px solid #60a5fa;outline-offset:1px}.ent{background:#2563eb;color:#fff;font-size:18px}.red{color:#dc2626}.summary{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:4px 6px;margin-top:5px}.reg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px 5px;font-size:11px}.reg b{text-align:right;font-size:12px}.reset{width:100%;height:27px;margin-top:3px;border:0;border-radius:6px;background:#e2e8f0;font-weight:800}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;margin-top:4px}.rate{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:5px 1px}.label{font-size:13px;font-weight:900}.n{font-size:21px;font-weight:900;line-height:1.1;margin:2px 0}.pct{font-size:16px;font-weight:800}.results{display:grid;grid-template-columns:1fr 1fr;gap:4px;text-align:center;margin-top:4px}.result{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:6px 2px}.result .big{font-size:20px;font-weight:900;margin-top:2px}.green{color:#059669}.amber{color:#d97706}.blue{color:#2563eb}@media(prefers-color-scheme:dark){body,.app{background:#0f172a;color:#f1f5f9}.disp,.key,.summary,.rate,.result{background:#1e293b;border-color:#475569;color:#f1f5f9}.ent{background:#2563eb}.reset{background:#334155;color:#fff}}
</style>
</head><body><main class="app">
<div class="title">検査実績計算</div><div id="guide" class="guide">① 質量合計を入力（kg）</div><div id="msg" class="msg" aria-live="polite"></div><input id="disp" class="disp" readonly placeholder="0" aria-label="入力値">
<div class="keys">
<button type="button" class="key" data-v="7">7</button><button type="button" class="key" data-v="8">8</button><button type="button" class="key" data-v="9">9</button><button type="button" class="key" data-v="+">＋</button>
<button type="button" class="key" data-v="4">4</button><button type="button" class="key" data-v="5">5</button><button type="button" class="key" data-v="6">6</button><button type="button" id="clear" class="key red">C</button>
<button type="button" class="key" data-v="1">1</button><button type="button" class="key" data-v="2">2</button><button type="button" class="key" data-v="3">3</button><button type="button" class="key" data-v=".">.</button>
<button type="button" class="key" data-v="0">0</button><button type="button" class="key" data-v="00">00</button><button type="button" id="back" class="key">⌫</button><button type="button" id="enter" class="key ent">Enter</button></div>
<div class="summary"><div class="reg"><span>質量合計</span><b id="tw">0 kg</b><span>タグ本数</span><b id="tc">0本</b><span>判定B・C</span><b id="bc">0本</b><span>不良品</span><b id="df">0本</b><span>単重</span><b id="uw">0 kg/本</b></div><button id="reset" type="button" class="reset">最初から</button></div>
<div class="rates"><div class="rate"><div class="label green">良品</div><div id="good" class="n">0本</div><div id="gp" class="pct">0.00%</div></div><div class="rate"><div class="label amber">手入れ品</div><div id="rew" class="n">0本</div><div id="rp" class="pct">0.00%</div></div><div class="rate"><div class="label red">不良品</div><div id="bad" class="n">0本</div><div id="dp" class="pct">0.00%</div></div></div>
<div class="results"><div class="result"><div class="label blue">検査手入れ後実績</div><div class="big"><span id="an">0</span>本　<span id="ak">0</span>kg</div></div><div class="result"><div class="label">スクラップ</div><div class="big"><span id="sn">0</span>本　<span id="sk">0</span>kg</div></div></div>
</main><script>
(()=>{const r=document.querySelector('.app'),q=x=>r.querySelector(x);let s={step:0,tw:0,tc:0,bc:0,df:0,uw:0};const guides=['① 質量合計を入力（kg）','② タグ本数を入力（本）','③ 判定B・Cを入力　例：1＋2＋3＋4','④ 不良品を入力（判定B・Cに含む）','⑤ 単重を入力（小数入力可）','入力完了'];function ex(x){if(!/^\d+(?:\.\d+)?(?:\+\d+(?:\.\d+)?)*$/.test(x))return null;const n=x.split('+').map(Number).reduce((a,b)=>a+b,0);return Number.isFinite(n)?n:null}function render(){q('#guide').textContent=guides[s.step];q('#tw').textContent=s.tw+' kg';q('#tc').textContent=s.tc+'本';q('#bc').textContent=s.bc+'本';q('#df').textContent=s.df+'本';q('#uw').textContent=s.uw+' kg/本';const good=Math.max(0,s.tc-s.bc),rew=Math.max(0,s.bc-s.df),bad=s.df,p=x=>s.tc?x/s.tc*100:0;const afterN=Math.max(0,s.tc-bad);const scrapKg=Math.round(bad*s.uw);const afterKg=Math.max(0,Math.round(s.tw-scrapKg));q('#good').textContent=good+'本';q('#rew').textContent=rew+'本';q('#bad').textContent=bad+'本';q('#gp').textContent=p(good).toFixed(2)+'%';q('#rp').textContent=p(rew).toFixed(2)+'%';q('#dp').textContent=p(bad).toFixed(2)+'%';q('#an').textContent=afterN;q('#ak').textContent=afterKg;q('#sn').textContent=bad;q('#sk').textContent=scrapKg}function enter(){if(s.step>=5)return;const raw=q('#disp').value,v=s.step===2?ex(raw):Number(raw);if(!raw||v===null||!Number.isFinite(v)||v<0){q('#msg').textContent='正しい数値を入力してください。';return}if(s.step===2&&Math.round(v)>s.tc){q('#msg').textContent='判定B・Cはタグ本数以下にしてください。';return}if(s.step===3&&Math.round(v)>s.bc){q('#msg').textContent='不良品は判定B・C以下にしてください。';return}q('#msg').textContent='';if(s.step===0)s.tw=v;else if(s.step===1)s.tc=Math.round(v);else if(s.step===2)s.bc=Math.round(v);else if(s.step===3)s.df=Math.round(v);else s.uw=v;s.step++;q('#disp').value='';render()}r.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.v,x=q('#disp').value;if(v==='+'&&s.step!==2)return;if(v==='+'&&(!x||x.endsWith('+')))return;if(v==='.'&&(s.step===1||s.step===2||s.step===3))return;if(v==='.'&&x.split('+').pop().includes('.'))return;if(x.length<28)q('#disp').value=x+v}));q('#enter').addEventListener('click',enter);q('#clear').addEventListener('click',()=>q('#disp').value='');q('#back').addEventListener('click',()=>q('#disp').value=q('#disp').value.slice(0,-1));q('#reset').addEventListener('click',()=>{s={step:0,tw:0,tc:0,bc:0,df:0,uw:0};q('#disp').value='';q('#msg').textContent='';render()});render()})();
</script></body></html>
