<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>検査実績計算</title>
<style>
*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;background:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a;overscroll-behavior:none}.app{max-width:430px;margin:auto;padding:6px 6px max(10px,env(safe-area-inset-bottom));background:#f8fafc;min-height:100vh}.title{font-size:19px;font-weight:900}.guide{min-height:23px;font-size:15px;font-weight:900;color:#2563eb;margin:2px 0}.msg{min-height:18px;color:#dc2626;font-size:12px;font-weight:800}.disp{width:100%;height:52px;text-align:right;font-size:30px;font-weight:900;padding:4px 10px;margin-bottom:6px;border:2px solid #cbd5e1;border-radius:10px;background:#fff}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.key{height:66px;border:1px solid #94a3b8;border-radius:12px;background:#fff;color:#0f172a;font-size:29px;font-weight:900;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}.key:active,.pressed{background:#dbeafe;transform:scale(.96)}.ent{background:#2563eb;color:#fff;font-size:19px}.red{color:#dc2626}.disabled{opacity:.35;background:#e2e8f0}.summary{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:5px 7px;margin-top:6px}.reg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px 5px;font-size:11px}.reg b{text-align:right;font-size:12px}.reset{width:100%;min-height:34px;margin-top:5px;border:0;border-radius:7px;background:#e2e8f0;font-weight:900;touch-action:manipulation}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;margin-top:5px}.rate,.result{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:5px 2px}.label{font-size:13px;font-weight:900}.n{font-size:21px;font-weight:900;line-height:1.1;margin:2px 0}.pct{font-size:16px;font-weight:800}.results{display:grid;grid-template-columns:1fr 1fr;gap:4px;text-align:center;margin-top:5px}.result .big{font-size:20px;font-weight:900;margin-top:2px}.green{color:#059669}.amber{color:#d97706}.blue{color:#2563eb}@media(prefers-color-scheme:dark){body,.app{background:#0f172a;color:#f1f5f9}.disp,.key,.summary,.rate,.result{background:#1e293b;border-color:#475569;color:#f1f5f9}.ent{background:#2563eb}.reset{background:#334155;color:#fff}.disabled{background:#334155;color:#94a3b8}}
</style>
</head><body><main class="app">
<div class="title">検査実績計算</div><div id="guide" class="guide"></div><div id="msg" class="msg" aria-live="polite"></div><input id="disp" class="disp" readonly placeholder="0" aria-label="入力値">
<div class="keys">
<button type="button" class="key" data-v="7">7</button><button type="button" class="key" data-v="8">8</button><button type="button" class="key" data-v="9">9</button><button type="button" id="plus" class="key" data-v="+">＋</button>
<button type="button" class="key" data-v="4">4</button><button type="button" class="key" data-v="5">5</button><button type="button" class="key" data-v="6">6</button><button type="button" id="clear" class="key red">C</button>
<button type="button" class="key" data-v="1">1</button><button type="button" class="key" data-v="2">2</button><button type="button" class="key" data-v="3">3</button><button type="button" class="key" data-v=".">.</button>
<button type="button" class="key" data-v="0">0</button><button type="button" class="key" data-v="00">00</button><button type="button" id="back" class="key">⌫</button><button type="button" id="enter" class="key ent">Enter</button></div>
<div class="summary"><div class="reg"><span>質量合計</span><b id="tw">0 kg</b><span>本数合計</span><b id="tc">0本</b><span>単重</span><b id="uw">0 kg/本</b><span>判定A・B</span><b id="bc">0本</b><span>不良品</span><b id="df">0本</b></div><button id="reset" type="button" class="reset">最初から</button></div>
<div class="rates"><div class="rate"><div class="label green">良品</div><div id="good" class="n">0本</div><div id="gp" class="pct">0.00%</div></div><div class="rate"><div class="label amber">手入れ品</div><div id="rew" class="n">0本</div><div id="rp" class="pct">0.00%</div></div><div class="rate"><div class="label red">不良品</div><div id="bad" class="n">0本</div><div id="dp" class="pct">0.00%</div></div></div>
<div class="results"><div class="result"><div class="label blue">検査手入れ後実績</div><div class="big"><span id="an">0</span>本　<span id="ak">0</span>kg</div></div><div class="result"><div class="label">スクラップ</div><div class="big"><span id="sn">0</span>本　<span id="sk">0</span>kg</div></div></div>
</main><script>
(()=>{const r=document.querySelector('.app'),q=x=>r.querySelector(x);let s={step:0,tw:0,tc:0,uw:0,bc:0,df:0};const guides=['① 質量合計を入力（kg）','② 本数合計を入力（本）','③ 単重を入力（kg/本）','④ 判定A・Bを入力　例：1＋2＋3＋4','⑤ 不良品を入力（判定A・Bに含む）','入力完了'];
function sum(x){if(!/^\d+(?:\+\d+)*$/.test(x))return null;return x.split('+').map(Number).reduce((a,b)=>a+b,0)}
function bind(el,fn){el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),70);fn()})}
function render(){q('#guide').textContent=guides[s.step];q('#tw').textContent=s.tw+' kg';q('#tc').textContent=s.tc+'本';q('#uw').textContent=s.uw+' kg/本';q('#bc').textContent=s.bc+'本';q('#df').textContent=s.df+'本';const good=Math.max(0,s.tc-s.bc),rew=Math.max(0,s.bc-s.df),bad=s.df,p=x=>s.tc?x/s.tc*100:0,scrap=Math.round(bad*s.uw);q('#good').textContent=good+'本';q('#rew').textContent=rew+'本';q('#bad').textContent=bad+'本';q('#gp').textContent=p(good).toFixed(2)+'%';q('#rp').textContent=p(rew).toFixed(2)+'%';q('#dp').textContent=p(bad).toFixed(2)+'%';q('#an').textContent=Math.max(0,s.tc-bad);q('#ak').textContent=Math.max(0,Math.round(s.tw-scrap));q('#sn').textContent=bad;q('#sk').textContent=scrap;q('#plus').classList.toggle('disabled',s.step!==3)}
function enter(){if(s.step>=5)return;const raw=q('#disp').value,v=s.step===3?sum(raw):Number(raw);if(!raw||v===null||!Number.isFinite(v)||v<0){q('#msg').textContent='正しい数値を入力してください。';return}if([1,3,4].includes(s.step)&&!Number.isInteger(v)){q('#msg').textContent='本数は整数で入力してください。';return}if(s.step===3&&v>s.tc){q('#msg').textContent='判定A・Bは本数合計以下にしてください。';return}if(s.step===4&&v>s.bc){q('#msg').textContent='不良品は判定A・B以下にしてください。';return}if(s.step===0)s.tw=v;else if(s.step===1)s.tc=v;else if(s.step===2)s.uw=v;else if(s.step===3)s.bc=v;else if(s.step===4)s.df=v;s.step++;q('#disp').value='';q('#msg').textContent='';render()}
r.querySelectorAll('[data-v]').forEach(b=>bind(b,()=>{const v=b.dataset.v,x=q('#disp').value;if(s.step>=5)return;if(v==='+'&&(s.step!==3||!x||x.endsWith('+')))return;if(v==='.'&&(![0,2].includes(s.step)||x.includes('.')))return;if(x.length<28)q('#disp').value=x+v;q('#msg').textContent=''}));bind(q('#enter'),enter);bind(q('#clear'),()=>{q('#disp').value='';q('#msg').textContent=''});bind(q('#back'),()=>{q('#disp').value=q('#disp').value.slice(0,-1);q('#msg').textContent=''});bind(q('#reset'),()=>{s={step:0,tw:0,tc:0,uw:0,bc:0,df:0};q('#disp').value='';q('#msg').textContent='';render()});render()})();
</script></body></html>
